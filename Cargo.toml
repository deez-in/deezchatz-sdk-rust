[package]
name = "deezchatz-sdk-rust"
version = "0.1.0"
edition = "2021"
description = "A programmatic SDK for the DeezChatz API and MQTT broker."
authors = ["DeezChatz"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"

# Networking
reqwest = { version = "0.12", features = ["json"] }
rumqttc = { version = "0.24", features = ["use-rustls"] }

# Crypto / Signal Protocol (using the local sibling repo)
libsignal-dezire = { path = "../libsignal-dezire" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
base64 = "0.22"
uuid = { version = "1.6", features = ["v4"] }
urlencoding = "2.1"
async-trait = "0.1"
sha2 = "0.10"
rand = "0.8"

# Logging
tracing = "0.1"
