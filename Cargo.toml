[package]
name = "deezchatz-sdk"
version = "0.2.0"
edition = "2021"
description = "A programmatic SDK for the DeezChatz API and MQTT broker."
authors = ["DeezChatz"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/deez-in/deezchatz-sdk-rust"
homepage = "https://deez.in"
documentation = "https://docs.rs/deezchatz-sdk"
keywords = ["messaging", "mqtt", "signal-protocol", "e2ee", "sdk"]
categories = ["network-programming", "cryptography", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"

# Networking
reqwest = { version = "0.12", features = ["json"] }
rumqttc = { version = "0.24", features = ["use-rustls"] }

# Crypto / Signal Protocol (using the published crate)
libsignal-dezire = "0.2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
base64 = "0.22"
uuid = { version = "1.6", features = ["v4"] }
urlencoding = "2.1"
async-trait = "0.1"
sha2 = "0.10"
rand = "0.8"

# Logging
tracing = "0.1"
